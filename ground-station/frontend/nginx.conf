server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API + internal proxied to the Spring backend on the compose network
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;

        # SSE: disable buffering so live mission events stream through
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding off;
    }
}
